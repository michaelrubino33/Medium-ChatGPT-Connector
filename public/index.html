<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Todo App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #667eea;
        }

        .status {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <h1>ChatGPT Todo App</h1>
    <p>MCP server is running!</p>
    <div class="status">
        <p><strong>Status:</strong> Online</p>
        <p><strong>MCP Endpoint:</strong> <code>/mcp</code></p>
    </div>
    <p>To use this app, connect it to ChatGPT as a connector.</p>
</body>

</html>
